<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>氨基酸分子拼装</title>
<link rel="stylesheet" href="css/base.css">
</head>
<body>

<header>
  <h1>氨基酸分子拼装</h1>
  <p class="subtitle">把左边的积木拖到骨架的空位上，点一下已放入的积木可以取下。</p>
</header>

<main>
  <aside id="palette" aria-label="积木面板">
    <h2>积木</h2>
    <div class="chip-list" id="chip-list"></div>
  </aside>

  <section id="canvas" aria-label="拼装画布">
    <h2>骨架</h2>
    <div class="scaffold" id="scaffold">
      <div class="slot" data-slot="carboxyl" data-name="羧基" data-drop-target="slot"></div>
      <div class="slot" data-slot="amino" data-name="氨基" data-drop-target="slot"></div>
      <div class="ca-badge" aria-hidden="true">Cα</div>
      <div class="slot" data-slot="hydrogen" data-name="氢" data-drop-target="slot"></div>
      <div class="slot slot-r" data-slot="sideChain" data-name="R 基" data-drop-target="slot">
        <div class="r-canvas" id="r-canvas"></div>
      </div>
    </div>
    <div class="structure" id="structure"></div>
  </section>

  <aside id="info" aria-label="性质说明">
    <h2>性质</h2>
    <p class="placeholder">拼装完成后在这里显示性质。</p>
  </aside>
</main>

<footer>
  <output id="message" aria-live="polite"></output>
  <p class="credit">结构式引自杨荣武《生物化学原理》（第四版）</p>
</footer>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal-close" id="modal-close" type="button" aria-label="关闭">×</button>
    <p class="modal-kicker">拼装完成</p>
    <h2 class="modal-title" id="modal-title"></h2>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="modal-figure" id="modal-figure"></div>
    <dl class="info-list" id="modal-props"></dl>
    <p class="modal-note" id="modal-note"></p>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/graph.js"></script>
<script src="js/canonical.js"></script>
<script src="js/layout.js"></script>
<script src="js/render.js"></script>
<script src="js/drag.js"></script>
<script src="js/app.js"></script>

</body>
</html>
